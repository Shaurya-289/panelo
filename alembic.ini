[alembic]
script_location = src/productivity_app/db/migrations
prepend_sys_path = .
path_separator = os
# The application sets sqlalchemy.url in code (see bootstrap._alembic_config).
# When running the alembic CLI by hand, supply it explicitly, e.g.
#   alembic -x ... or uncomment and edit the line below.
# sqlalchemy.url = sqlite:///path/to/productivity.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
