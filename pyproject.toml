[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "productivity-app"
version = "0.1.0"
description = "Local-first productivity application backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "PySide6>=6.8,<7",
  "tzdata>=2025.2,<2027",
]

[project.gui-scripts]
productivity-app = "productivity_app.desktop.main:main"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/productivity_app"]
# The QML pages, their JavaScript helpers and the font are data files inside the package.
artifacts = [
  "src/productivity_app/ui/qml/**/*",
  "src/productivity_app/ui/fonts/*",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=productivity_app --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".deps", ".pytest_tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["productivity_app"]
exclude = ["src/productivity_app/db/migrations"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# The self-test steps are test scripts driving QML windows through untyped Qt objects.
[[tool.mypy.overrides]]
module = [
  "productivity_app.ui.selftest.steps_core",
  "productivity_app.ui.selftest.steps_layout",
  "productivity_app.ui.selftest.steps_round7",
  "productivity_app.ui.selftest.steps_views",
  "productivity_app.ui.selftest.unit_checks",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["func-returns-value", "call-overload", "arg-type", "attr-defined", "no-any-return", "union-attr", "return-value"]
